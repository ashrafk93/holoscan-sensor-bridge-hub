name: Check metadata validity

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, holoscan-sdk-lws2]

jobs:
  check-metadata:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Metadata Tool Dependencies
        run: |
          python -m pip install -r tools/metadata/requirements.txt

      - name: Run metadata_validator.py
        run: python tools/metadata/metadata_validator.py

      - name: Run gather_metadata.py
        run: python tools/metadata/gather_metadata.py
